[profile.dev.package."*"]
opt-level = 3

[package]
name = "vault_core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
csv = "1"
data-encoding = "2"
hmac = "0.12"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1"
